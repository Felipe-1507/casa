<!doctype html><html lang="pt-BR"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#365b43"><meta name="description" content="Casa atual e estudos de melhorias em 3D, com alternativas de ampliação e comparação de ambientes."><title>Casa BP · Proposta escolhida e alternativa de garagem</title><style>*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',Arial,sans-serif;color:#344b3b;background:#f2f2e9}nav{height:63px;display:flex;align-items:center;gap:9px;padding:0 20px;border-bottom:1px solid #dce3d5}strong{font:21px Georgia,serif;margin-right:10px}button{min-height:40px;padding:9px 13px;border-radius:7px;border:1px solid #d6dece;background:#fffef8;color:#496347;cursor:pointer;font:inherit}button.active{color:white;background:#365b43;border-color:#365b43}.hint{margin-left:auto;font-size:11px;color:#8a9582}iframe{border:0;display:block;width:100%;height:calc(100dvh - 63px)}@media(max-width:760px){nav{height:98px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:5px 8px}strong{grid-column:1 / -1;font-size:18px}button{padding:6px 3px;font-size:10px;min-height:39px}.hint{display:none}iframe{height:calc(100dvh - 98px)}}</style></head><body><nav role="tablist" aria-label="Versões da casa"><strong>Casa BP</strong><button id="atual" role="tab" aria-selected="false">Casa atual</button><button id="futuro" role="tab" aria-selected="false">Estudos A–D</button><button id="proposta" role="tab" aria-selected="false">Proposta anterior</button><button id="garagem" class="active" role="tab" aria-selected="true">Projeto atual</button><span class="hint">G03 · frente unificada · tour a pé</span></nav><iframe id="visualizador" title="Frente unificada e tour a pé" src="proposta-garagem/ABRIR-GARAGEM-3D.html?rev=G03" allow="fullscreen"></iframe><script>const f=document.getElementById('visualizador'),sources={atual:'projeto-3d/ABRIR-MODELO-3D.html',futuro:'melhorias-futuras/ABRIR-MELHORIAS-3D.html',proposta:'proposta-escolhida/ABRIR-PROPOSTA-3D.html?rev=05',garagem:'proposta-garagem/ABRIR-GARAGEM-3D.html?rev=G03'};function select(id){const tour=id==='tour';if(id==='tour'||id==='seal')id='garagem';if(!sources[id])return;f.src=sources[id]+(tour?'&tour=1':'');f.title=document.getElementById(id).textContent+' em 3D';document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.id===id);b.setAttribute('aria-selected',String(b.id===id));});}for(const id of Object.keys(sources))document.getElementById(id).onclick=()=>{select(id);history.replaceState(null,'','#'+id);};addEventListener('hashchange',()=>select(location.hash.slice(1)));if(sources[location.hash.slice(1)]||['tour','seal'].includes(location.hash.slice(1)))select(location.hash.slice(1));f.addEventListener('load',()=>{try{const d=f.contentDocument;for(const o of d.querySelectorAll('#vehicle,[data-view=garagem]'))o.hidden=true;}catch(e){}});</script></body></html>
